name: Update NFL data

on:
  schedule:
    - cron: '0 11 * * *'     # every day at 11:00 UTC (about 7am Eastern)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      # The first run also builds the previous 3 seasons (once); later runs reuse them.
      # ODDS_API_KEY comes from Settings > Secrets and variables > Actions > Secrets.
      - run: python nfl_update.py --out nfl_output --history 3
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Save the new data files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_output
          git diff --cached --quiet || (git commit -m "Update NFL data" && git push)
