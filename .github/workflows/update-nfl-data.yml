name: Update NFL data

on:
  schedule:
    - cron: '0 11 * * *'     # every day at 11:00 UTC (about 7am Eastern)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python nfl_update.py --out nfl_output
      - name: Save the new data files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_output
          git diff --cached --quiet || (git commit -m "Update NFL data" && git push)
