name: Recover props history

# One-off, manual only. It rebuilds nfl_output/props_history.csv from the old versions of
# props.csv saved in this repo's history. It never runs on a schedule.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # download the full history so old versions of props.csv are available
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy
      - run: python recover_props_history.py --repo-path . --out nfl_output
      - name: Save props_history.csv
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add nfl_output/props_history.csv
          git diff --cached --quiet || (git commit -m "Recover props history" && git push)
