<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#050505;--card:#15181d;--tx:#e8ebf1;--mu:#8d98ac;--ac:#5b9bff;--bd:#2a3342;--g:#3fcf7a;--r:#ff6b5b}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{margin-right:10px}
.tab{border:0;background:none;color:var(--mu);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 280px}
h3{margin:0 0 8px;font-size:15px}.mu{color:var(--mu);font-size:12px}
select,textarea,button.b,input{font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 8px}
button.b{cursor:pointer;background:var(--ac);color:#fff;border:0}button.b.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
textarea{width:100%;height:90px;font-family:ui-monospace,monospace;font-size:12px}
.sc{display:flex;justify-content:space-around;text-align:center;gap:8px}.sc .n{font-size:30px;font-weight:700}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.g{color:var(--g)}.r{color:var(--r)}.gm{cursor:pointer;padding:7px 8px;border-radius:6px;display:flex;justify-content:space-between}.gm:hover,.gm.on{background:var(--bg)}
.msg{padding:8px;border-radius:6px;margin-top:6px;font-size:13px}.ok{background:rgba(23,128,61,.15)}.er{background:rgba(192,57,43,.15)}

.wkb{display:flex;flex-direction:column;gap:4px;width:58px;flex:none;position:sticky;top:60px;max-height:80vh;overflow:auto;background:#7a1a63;padding:6px;border-radius:6px}
.wkb button{border:0;background:#2b2b2b;color:#fff;font-weight:700;padding:6px 0;border-radius:5px;cursor:pointer;font-size:12px}.wkb button.on{background:#b8c000;color:#000}
.ttl{display:inline-block;background:#4b1740;color:#fff;font-weight:700;padding:6px 14px;border:1px solid #8e1d6f;border-radius:4px;margin-right:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.gc{display:flex;align-items:stretch;background:#fff;color:#000;border:3px solid transparent;cursor:pointer;font-size:12px}.gc.on{border-color:#e8d800}
.ys{display:flex}.ys span,.pt span{flex:1;display:flex;flex-direction:column;text-align:center;background:#d0d0d0;font-size:11px;padding-top:1px}
.ys b,.pt b{background:#fff;font-size:13px;font-weight:600;padding:2px 4px;border:1px solid #bbb}.pt{display:flex;width:104px;flex:none;align-self:flex-end}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.gc{display:grid;grid-template-columns:repeat(8,1fr);gap:0}.gc .nm{font-weight:700;text-align:center;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .fin{grid-column:span 8;background:#222;color:#ddd;font-size:11px;text-align:center;padding:1px}
.gc span{display:flex;flex-direction:column;text-align:center;background:#d0d0d0;font-size:11px;padding-top:1px}.gc span b{background:#fff;font-size:13px;font-weight:600;padding:2px 2px;border:1px solid #bbb}

.algb table{font-size:12px}.algb td,.algb th{padding:3px 5px}.algb tr{cursor:pointer}.algb tr.on td:first-child{background:var(--ac);color:#fff}
@media(max-width:1000px){.wrapx{flex-wrap:wrap}.algb{width:100%;position:static;max-height:none}}

.grid2{grid-template-columns:repeat(auto-fit,minmax(350px,1fr))}
.gc{display:flex;flex-wrap:wrap;gap:6px;background:transparent;color:#000;padding:3px;border:3px solid transparent;cursor:pointer}
.gc .tb{flex:1 1 0;min-width:0;display:flex;flex-direction:column}.gc .mid{flex:0 0 120px;display:flex;flex-direction:column}
.gc .nm{display:block;font-weight:700;text-align:center;padding:5px 4px;font-size:13px}
.gc .sp{display:flex;background:#fff;color:#000;font-weight:600}.gc .sp span{display:block;flex:1;background:#fff;padding:5px 3px;font-size:12px;text-align:center;white-space:nowrap}
.gc .ys{display:flex;flex:1}.gc .ys span{flex:1 1 auto;display:flex;flex-direction:column;text-align:center;background:#d0d0d0;color:#000;font-size:10px;padding:3px 3px 0;white-space:nowrap}
.gc .ys b{background:#fff;font-size:15px;font-weight:600;padding:4px 2px;border:0;margin:3px -3px 0}
.gc .fin{flex-basis:100%;grid-column:auto;background:#222;color:#ddd;font-size:11px;text-align:center;padding:2px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.gc{gap:4px}.gc .mid{flex:0 0 92px}.gc .tb{flex:1 1 0}
.gc .nm{font-size:14px;padding:6px 4px}
.gc .sp span{padding:6px 2px;font-size:11px}.gc .sp span:first-child{flex:1.6}
.gc .ys span{font-size:11px;padding:4px 2px 0}.gc .ys b{font-size:16px;padding:5px 2px;margin:3px -2px 0}
.gc .mid .ys span{font-size:10px}

.gc{container-type:inline-size;padding:2px;border-width:2px;gap:3px}.gc .mid{flex:0 0 80px}
.gc .nm{font-size:clamp(11px,3.1cqw,15px);padding:7px 3px}
.gc .sp span{font-size:10px;padding:7px 1px}
.gc .ys span{font-size:11px}.gc .ys b{font-size:clamp(15px,4.4cqw,19px);padding:6px 2px}
.gc .mid .ys span{font-size:9px}

.grid2{grid-auto-flow:row dense}.xp{grid-column:1/-1;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px}
.xg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;align-items:start}.xt{font-size:12px}.xt th,.xt td{padding:3px 6px}
#tip{position:fixed;display:none;z-index:99;max-width:310px;background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.45);text-align:left;white-space:normal}

/* ---- cleaner week selector ---- */
.wkb{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 4px;width:50px;gap:2px;top:64px;scrollbar-width:none}
.wkb::-webkit-scrollbar{display:none}
.wkb::before{content:'WEEK';font-size:8px;letter-spacing:.14em;color:var(--mu);text-align:center;padding:3px 0 5px}
.wkb button{background:transparent;color:var(--mu);font-weight:600;font-size:13px;border-radius:8px;padding:7px 0;transition:background .15s,color .15s}
.wkb button:hover{background:rgba(91,155,255,.14);color:var(--tx)}
.wkb button.on{background:var(--ac);color:#fff;box-shadow:0 2px 8px rgba(91,155,255,.35)}
.wkb button:nth-child(n+19){font-size:10px}.wkb button:nth-child(19){margin-top:6px}
.ttl{background:transparent;border:0;border-left:3px solid var(--ac);border-radius:0;padding:2px 12px;color:var(--tx);font-size:17px}
/* ---- phone / small screens ---- */
.m-only{display:none!important}.xclose{display:none}.gc i{font-style:normal}
@media(max-width:700px){
 .d-only{display:none!important}.m-only{display:inline!important}
 main{padding:6px}
 header{padding:6px 8px;gap:2px}.tab{padding:6px 9px;font-size:13px}#sync{display:none}
 .wrapx{flex-wrap:nowrap;gap:6px}
 .wkb{width:36px;padding:4px 2px;top:70px}.wkb button{font-size:11px;padding:6px 0}.wkb button:nth-child(n+19){font-size:8px}.wkb::before{font-size:7px}
 .algb{width:94px;position:sticky;top:70px;max-height:80vh;padding:2px}
 .algb table{font-size:10px}.algb td,.algb th{padding:3px 2px}.algb .cap.norm{display:none}.algb .cap{font-size:9px}
 .ttl{font-size:14px;padding:2px 8px}
 .gc{gap:2px;padding:1px;border-width:2px}.gc .mid{flex:0 0 68px}
 .gc .nm{font-size:12px;padding:5px 2px}
 .gc .sp span{font-size:8px;padding:5px 1px;letter-spacing:-.2px}
 .gc .ys span{font-size:8px;padding:3px 1px 0}.gc .ys b{font-size:12px;padding:4px 0;margin:2px -1px 0}
 .gc .fin{font-size:9px}
 .xp{position:fixed;inset:0;z-index:60;overflow:auto;border-radius:0;border:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--bg)}
 .xclose{display:block;position:sticky;top:0;z-index:2;margin-bottom:8px}
 .xt{font-size:11px}.xt th,.xt td{padding:3px 4px}
 .sc .n{font-size:22px}
}

/* team names / final strip: plain text over the colour, no grey boxes */
.gc .nm span,.gc .fin span{display:inline;flex-direction:row;background:transparent;padding:0;margin:0;font-size:inherit;color:inherit;text-align:inherit;white-space:inherit}
@media(max-width:700px){#sync{display:block;flex-basis:100%;font-size:10px;margin:0}}


/* ---- Projections tab / Projection Lab ---- */
.pj{border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;background:var(--bg)}
.pjh{display:flex;gap:8px;align-items:center;padding:8px 10px;cursor:pointer;flex-wrap:wrap}
.pjs{margin-left:auto;display:flex;gap:6px;align-items:center}.pjs i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--card)}
.pjs i.g{color:var(--g)}.pjs i.r{color:var(--r)}
.pjb{padding:0 10px 10px}.fx{font-family:ui-monospace,monospace;font-size:12px;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px;margin:6px 0}
.fx div{margin:2px 0}.lbp{display:flex;gap:6px;flex-wrap:wrap}
.lbf{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:10px 0;padding:10px;border:1px dashed var(--bd);border-radius:8px}
.lbf label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
@media(max-width:700px){.pjs{margin-left:0;width:100%}}

/* ---- cleaner mobile projection cards (from the live site) ---- */
@media(max-width:700px){
 .gc{gap:3px;padding:2px;border-width:1px;border-radius:6px}
 .gc .mid{flex:0 0 64px}
 .gc .nm{font-size:10px;line-height:1.15;padding:4px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .gc .sp span{font-size:7px;line-height:1.1;padding:4px 1px;letter-spacing:-.1px}
 .gc .ys span{font-size:7px;line-height:1.1;padding:2px 1px 0}
 .gc .ys b{font-size:10px;line-height:1.1;padding:3px 0;margin:2px -1px 0}
 .gc .fin{font-size:8px;line-height:1.1}
}
</style></head><body>
<header><b>🏈<span class="d-only"> NFL Model</span></b><span class="mu d-only" style="margin-right:10px">v6</span><span id="tabs"></span><span id="sync" class="mu" style="margin-left:auto;font-size:11px"></span></header>
<main id="app"></main>
<script>
const T="ARI ATL BAL BUF CAR CHI CIN CLE DAL DEN DET GNB HOU IND JAX KAN LVR LAC LAR MIA MIN NWE NOR NYG NYJ PHI PIT SFO SEA TAM TEN WAS".split(" ");
const AL={GB:'GNB',KC:'KAN',LV:'LVR',SF:'SFO',TB:'TAM',NE:'NWE',NO:'NOR',JAC:'JAX',LA:'LAR',WSH:'WAS'};
const WK=[...Array(18)].map((_,i)=>String(i+1)).concat(['wildcard','division','confchamp','superbowl']);
const ALG=['1-Basic','2-Marginal %','3-SOS Marginal %','4-Ave of 1,2,3','5-Std Dev 1','6-Std Dev 2','7-Std Dev 3','8-Ave Std Error 5,6,7','9-Spread (wtd)','10-ML (wtd)','11-Total (wtd)','12-STE Dev','13-Final MGN %','14-Std Error of 13','15-Mng TD %','16-Best Fit'];
const K=[['pts','pf','pa'],['pass','pass','pass_a'],['rush','rush','rush_a']];
const TPL={teams:'team,pf,pa,pass,rush,pass_a,rush_a,ypa,ypc,dvp_qb,dvp_rb,dvp_wr,dvp_te\nKAN,27.1,19.5,255,118,225,105,7.2,4.4,18.5,19.2,31.0,12.1',
games:'week,away,home,away_score,home_score,spread,total\n5,BUF,KAN,,,-2.5,48.5',
dvp:'team,qb_att,qb_cmp,qb_yds,qb_td,qb_ratt,qb_ryds,qb_rtd,rb_att,rb_yds,rb_td,rb_tgt,rb_rec,rb_ryds,rb_rtd,wr_tgt,wr_rec,wr_yds,wr_td,te_tgt,te_rec,te_yds,te_td',
tds:'scorer,pos,type,yards,passer,team,defense,week,game,qtr,clock,first\nExample Player,WR,Passing,25,Example QB,KAN,BAL,1,BAL @ KAN,2,,1',
weekly:'team,week,opp,pf,pa,pass,rush,pass_a,rush_a,ptd,rtd,ptd_a,rtd_a\nKAN,1,BAL,27,20,255,118,225,105,2,1,1,1',
players:'player,team,pos,tgt_share,catch_rate,ypt,carry_share,ypc,td_rate\nExample QB,KAN,QB,,0.66,,,,0.05\nExample WR,KAN,WR,0.24,0.68,8.5,,,0.07'};
const TC={ARI:['#97233F','#FFB612'],ATL:['#000','#E0314B'],BAL:['#241773','#C9A227'],BUF:['#00338D','#fff'],CAR:['#0085CA','#101820'],CHI:['#0B162A','#E64100'],CIN:['#FB4F14','#000'],CLE:['#311D00','#FF5A1F'],DAL:['#003594','#B8C2C7'],DEN:['#FB4F14','#002244'],DET:['#0076B6','#E3E8EB'],GNB:['#203731','#FFB612'],HOU:['#03202F','#E0314B'],IND:['#002C5F','#D5DADC'],JAX:['#006778','#D7A22A'],KAN:['#E31837','#FFB81C'],LVR:['#000','#C5CACD'],LAC:['#0080C6','#FFC20E'],LAR:['#003594','#FFA300'],MIA:['#008E97','#FC4C02'],MIN:['#4F2683','#FFC62F'],NWE:['#002244','#E0314B'],NOR:['#D3BC8D','#101820'],NYG:['#0B2265','#E0314B'],NYJ:['#125740','#fff'],PHI:['#004C54','#C5CACD'],PIT:['#FFB612','#101820'],SFO:['#AA0000','#D9BF77'],SEA:['#002244','#69BE28'],TAM:['#D50A0A','#FF9A3C'],TEN:['#4B92DB','#0C2340'],WAS:['#5A1414','#FFB612']};
const NMS="Arizona Cardinals,Atlanta Falcons,Baltimore Ravens,Buffalo Bills,Carolina Panthers,Chicago Bears,Cincinnati Bengals,Cleveland Browns,Dallas Cowboys,Denver Broncos,Detroit Lions,Green Bay Packers,Houston Texans,Indianapolis Colts,Jacksonville Jaguars,Kansas City Chiefs,Las Vegas Raiders,Los Angeles Chargers,Los Angeles Rams,Miami Dolphins,Minnesota Vikings,New England Patriots,New Orleans Saints,New York Giants,New York Jets,Philadelphia Eagles,Pittsburgh Steelers,San Francisco 49ers,Seattle Seahawks,Tampa Bay Buccaneers,Tennessee Titans,Washington Commanders".split(',');const FN=t=>NMS[T.indexOf(t)];const WL={wildcard:'WC',division:'DIV',confchamp:'CONF',superbowl:'SB'};
const chip=(t,x='')=>`<span style="background:${TC[t][0]};color:${TC[t][1]};padding:2px 8px;border-radius:3px;font-weight:700;${x}">${t}</span>`;
const WEB_DATA='nfl_output/';
let S={teams:null,weekly:null,games:{},players:[],locks:{}},tab='games',wk='1',gid=null,aid=16,logm='',W=[1,1,1,1];
try{const s=localStorage.getItem('nflm');if(s)S=JSON.parse(s)}catch(e){}
const save=()=>{try{localStorage.setItem('nflm',JSON.stringify(S))}catch(e){}};
const nm=x=>{x=String(x).trim().toUpperCase();x=AL[x]||x;if(!T.includes(x))throw Error('Unknown team "'+x+'" — import rejected');return x};
const f=(x,d=1)=>x==null||isNaN(x)?'–':Number(x).toFixed(d);
function csv(t){const L=t.trim().split(/\r?\n/).filter(x=>x.trim());if(L.length<2)throw Error('No data rows found');
 const h=L[0].split(',').map(x=>x.trim().toLowerCase());
 return L.slice(1).map((l,i)=>{const c=l.split(',');if(c.length!==h.length)throw Error('Row '+(i+2)+' has '+c.length+' columns, expected '+h.length);
  const o={};h.forEach((k,j)=>{const v=c[j].trim();o[k]=v!==''&&!isNaN(v)?+v:v});return o})}
function need(r,cols){cols.forEach(c=>{if(!(c in r[0]))throw Error('Missing column: '+c)})}
const IMP={
 teams(t){const r=csv(t);need(r,['team','pf','pa','pass','rush','pass_a','rush_a']);const o={};
  r.forEach(x=>{const k=nm(x.team);if(o[k])throw Error('Duplicate team '+k);K.forEach(([_,a,b])=>{if(typeof x[a]!=='number'||typeof x[b]!=='number')throw Error(k+': non-numeric '+a+'/'+b)});o[k]=x});
  if(Object.keys(o).length!==32)throw Error('Expected 32 teams, got '+Object.keys(o).length);S.teams=o;return '32 teams imported'},
 games(t){const r=csv(t);need(r,['week','away','home']);const seen={},add={};
  r.forEach(x=>{x.week=String(x.week).toLowerCase();if(!WK.includes(x.week))throw Error('Bad week "'+x.week+'"');x.away=nm(x.away);x.home=nm(x.home);
   x.id=x.week+'|'+x.away+'@'+x.home;if(seen[x.id])throw Error('Duplicate game '+x.id);seen[x.id]=1;
   ['away_score','home_score','spread','total'].forEach(k=>{if(x[k]==='undefined'||x[k]==null)x[k]=''});
   x.final=typeof x.away_score==='number'&&typeof x.home_score==='number';add[x.id]=x});
  Object.assign(S.games,add);return r.length+' games imported/updated'},
 weekly(t){const r=csv(t);need(r,['team','week','opp','pf','pa','pass','rush','pass_a','rush_a']);const seen={};
  r.forEach(x=>{x.team=nm(x.team);x.opp=nm(x.opp);x.week=+x.week;if(!(x.week>=1))throw Error('Bad week '+x.week);const k=x.team+'|'+x.week;if(seen[k])throw Error('Duplicate '+x.team+' week '+x.week);seen[k]=1;ST.forEach(c=>{if(c in x&&typeof x[c]!=='number')throw Error(x.team+' wk'+x.week+': non-numeric '+c)})});
  S.weekly=r;return r.length+' team-weeks imported'},
 dvp(t){const r=csv(t);need(r,['team','qb_att','rb_att','wr_tgt','te_tgt']);const o={};r.forEach(x=>{const k=nm(x.team);if(o[k])throw Error('Duplicate team '+k);Object.keys(x).forEach(c=>{if(c!=='team'&&typeof x[c]!=='number')throw Error(k+': non-numeric '+c)});o[k]=x});if(Object.keys(o).length!==32)throw Error('Expected 32 teams, got '+Object.keys(o).length);S.dvp=o;return '32 teams of defense-vs-position detail imported'},
 tds(t){const r=csv(t);need(r,['scorer','pos','team','defense']);r.forEach(x=>{x.team=nm(x.team);x.defense=nm(x.defense);x.pos=String(x.pos).toUpperCase();x.scorer=String(x.scorer)});S.tds=r;return r.length+' TD events imported'},
 players(t){const r=csv(t);need(r,['player','team','pos']);r.forEach(x=>{x.team=nm(x.team);x.pos=String(x.pos).toUpperCase();if(!['QB','RB','WR','TE'].includes(x.pos))throw Error('Bad pos '+x.pos)});
  S.players=r;return r.length+' players imported'}};
function doImport(k){try{logm='✔ '+IMP[k](document.getElementById('t_'+k).value);save();DV++;touch([k]);logm=['ok',logm]}catch(e){logm=['er','✖ '+e.message+' (existing data kept)']}render()}

/* ---------- model ---------- */

const LM={pts:'Points',tot:'Total yds',pass:'Pass yds',rush:'Rush yds'},LMs=m=>m==='$m'?'[each stat]':LM[m];
const WHOL={team:'Team',opp:'Opp',league:'League avg',faced:'Avg of Team’s opponents',ofaced:'Avg of Opp’s opponents',x:'Each opponent',xfaced:'Opponent’s own opponents'},SIDEL={off:'gained',al:'allowed',ypp:'yds/pt scored',yapp:'yds/pt allowed'};
const R_=(who,side,m)=>({k:'r',who,side,m}),B_=(op,a,b)=>({k:'b',op,a,b}),C_=v=>({k:'c',v}),cp=n=>JSON.parse(JSON.stringify(n));
const lv=(d,s,m)=>s==='off'?d.off[m]:s==='al'?d.al[m]:s==='ypp'?d.ypp[m]:d.yapp[m];
function lgv(C,s,m){C._l=C._l||{};const k=s+m;return C._l[k]!==undefined?C._l[k]:(C._l[k]=T.reduce((a,t)=>a+lv(C.D[t],s,m),0)/32)}
/* evaluate a formula tree for one team (x.t) against its opponent (x.o) using the stats in C */
function ev(n,x){const mm=v=>v==='$m'?x.m:v;
 switch(n.k){
 case 'c':return n.v;
 case 'r':{const m=mm(n.m);if(!m)return NaN;const C=x.C,D=C.D;
  if(n.who==='team')return lv(D[x.t],n.side,m);if(n.who==='opp')return lv(D[x.o],n.side,m);
  if(n.who==='x')return x.xo?lv(D[x.xo],n.side,m):NaN;if(n.who==='league')return lgv(C,n.side,m);
  const L=(n.who==='faced'?C.opp[x.t]:n.who==='ofaced'?C.opp[x.o]:x.xo?C.opp[x.xo]:[])||[];
  return L.length?L.reduce((a,t)=>a+lv(D[t],n.side,m),0)/L.length:NaN}
 case 'p':{const r=x.R&&x.R[n.n-1];return r?r.pts:NaN}
 case 'b':{const a=ev(n.a,x),b=ev(n.b,x);return n.op==='+'?a+b:n.op==='-'?a-b:n.op==='*'?a*b:a/b}
 case 'avg':return avg_(n.items.map(i=>ev(i,x)));
 case 'wavg':{let s=0,w=0;n.items.forEach(i=>{s+=ev(i.n,x)*i.w;w+=i.w});return s/w}
 case 'pts':{const m=mm(n.m);if(!m||m==='pts')return NaN;const D=x.C.D,y=ev(n.y,x);return(y/D[x.t].ypp[m]+y/D[x.o].yapp[m])/2}
 case 'favg':{const L=(n.who==='opp'?x.C.opp[x.o]:x.C.opp[x.t])||[];return L.length?avg_(L.map(xo=>ev(n.body,{...x,xo}))):NaN}
 case 'allm':return avg_(n.ms.map(m=>ev(n.body,{...x,m})))}
 return NaN}
function tx(n){switch(n.k){
 case 'c':return String(n.v);
 case 'r':return WHOL[n.who]+' '+LMs(n.m)+' '+SIDEL[n.side];
 case 'p':return 'P'+n.n;
 case 'b':return '('+tx(n.a)+' '+({'+':'+','-':'−','*':'×','/':'÷'})[n.op]+' '+tx(n.b)+')';
 case 'avg':return 'Avg('+n.items.map(tx).join(', ')+')';
 case 'wavg':return 'WAvg('+n.items.map(i=>tx(i.n)+' ×'+i.w).join(', ')+')';
 case 'pts':return 'Pts['+LMs(n.m)+']('+tx(n.y)+')';
 case 'favg':return 'Avg over '+(n.who==='opp'?'Opp’s':'Team’s')+' opponents of '+tx(n.body);
 case 'allm':return 'Avg over '+n.ms.map(m=>LM[m]).join('/')+' of '+tx(n.body)}

 const badge=p=>showB&&p.call?` <span title="Boom ${Math.round(p.pBoom*100)}% / Bust ${Math.round(p.pBust*100)}%">${p.call.split(' ')[0]}</span>`:'';

 const rush=mk('Rushing (team)','#e29bdc','#000',['Team','Att','Yds','TDs'],teams.map(t=>`<tr><td>${chip(t)}</td><td>${f(pe[t].car,0)}</td><td>${f(pe[t].s.rush,0)}</td><td>${f(pe[t].players.reduce((a,p)=>a+p.rtd,0),1)}</td></tr>`).join(''));
 const recT=teams.map(t=>{const[b,fg]=col(t);return mk(FN(t)+' receivers ('+pe[t].role+')',b,fg,['Receivers','Tgts','Rec','Yds','TDs'],pe[t].players.filter(p=>p.tgt>=.3).sort((a,c)=>c.tgt-a.tgt).map(p=>`<tr style="${bg(p)}"><td>${p.name}-${p.pos}${stt(p)}${badge(p)}</td><td>${f(p.tgt,0)}</td><td>${f(p.rec,0)}</td><td>${f(p.recyds,0)}</td><td>${f(p.rectd,1)}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">No players imported</td></tr>')}).join('');
 const rusT=teams.map(t=>{const[b,fg]=col(t);return mk(FN(t)+' rushers: RBs and QBs ('+pe[t].role+')',b,fg,['Rushers','Att','Yds','TD'],pe[t].players.filter(p=>p.car>=.3).sort((a,c)=>c.car-a.car).map(p=>`<tr style="${bg(p)}"><td>${p.name}-${p.pos}${stt(p)}${badge(p)}</td><td>${f(p.car,0)}</td><td>${f(p.ryds,0)}</td><td>${f(p.rtd,2)}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">No players imported</td></tr>')}).join('');
 const fpT=S.teams[g.home].dvp_qb!=null?'<h3>Opp D vs position (fantasy pts allowed/game)</h3>'+dvp(g):'';
 const avl=teams.map(t=>{const P=pe[t],rows=P.players.filter(p=>p.pos==='QB'||p.fp>=2||p.a<1).slice(0,14);return `<div><b>${chip(t)} availability</b>${P.swap?` <span class="mu">⚠ ${P.starter} starts instead of ${P.usual}: team pass yards ×${f(P.swapF,2)} (his efficiency is shrunk toward ${P.priorKind==='first starts'?'how QBs in their first 3 starts have played':'the league average'})</span>`:''}<div class="w"><table class="xt"><tr><th>Player</th><th>Status</th></tr>${rows.map(p=>`<tr><td>${p.name}-${p.pos}${p.starter?' ★':''}${p.note?` <span class="mu">${p.note}</span>`:''}</td><td><select onchange="setAvail('${p.name.replace(/'/g,"\\'")}',this.value)">${[['active','Active'],['questionable','Questionable'],['doubtful','Doubtful'],['out','Out'],...(p.pos==='QB'?[['start','Starting QB']]:[])].map(([v,l])=>`<option value="${v}" ${(((S.avail||{})[p.name])||p.status)===v?'selected':''}>${l}</option>`).join('')}</select></td></tr>`).join('')}</table></div><div style="display:flex;gap:6px;margin-top:4px"><input id="aq_${t}" placeholder="Starting QB not listed? type a name" style="flex:1;min-width:0"><button class="b s" onclick="addQB('${t}')">Add QB</button></div></div>`}).join('');
 const outlook=showB?(hasLogs()?`<div class="card"><h3>Best Fit player outlook <span class="mu">(🔥 boom: a big game is more likely than usual · ❄ bust: a dud is more likely · 🎲 both)</span></h3><div class="w"><table class="xt"><tr><th>Player</th><th>Status</th><th>Proj FP</th><th>vs his avg</th><th>Boom %</th><th>Bust %</th><th>Call</th><th>Games of data</th></tr>${teams.flatMap(t=>pe[t].players.filter(p=>p.fp>=1.5).map(p=>({t,p}))).sort((a,b)=>b.p.pBoom-a.p.pBoom).map(({t,p})=>`<tr style="${bg(p)}"><td>${chip(t)} ${p.name}-${p.pos}</td><td>${p.status}</td><td>${f(p.fp,1)}</td><td>${p.vsAvg==null?'–':(p.vsAvg>=0?'+':'')+Math.round(p.vsAvg*100)+'%'}</td><td>${Math.round(p.pBoom*100)}%</td><td>${Math.round(p.pBust*100)}%</td><td>${p.call||'–'}</td><td>${p.nG}${p.thin?' ⚠ thin':''}</td></tr>`).join('')}</table></div><div class="mu">Boom/bust thresholds are the player’s own 80th/20th-percentile fantasy games (or 1.5×/0.5× the projection with fewer than 6 games); the probability uses a gamma distribution centred on today’s projection with the player’s own game-to-game variability, shrunk toward his position. Flags mark this game’s 3 most likely boom candidates (at least a 25% chance) and 3 most likely bust candidates (at least 30%); the baseline for either is about 20%. “vs his avg” shows whether today’s projection sits above or below his usual fantasy output, so a whole group running high or low points to the model, not the player.</div></div>`:'<div class="card"><h3>Best Fit player outlook</h3><div class="mu">Load player game logs (Data tab boxes 9–10, or the weekly automation) to see boom/bust odds.</div></div>'):'';
 return `<div class="xp"><button class="b xclose" onclick="pick('${g.id}')">✕ Close</button><div style="margin-bottom:8px"><button class="b ${showB?'':'s'}" onclick="togBFP('${g.id}')">🎯 Best Fit players${showB?' (on)':''}</button> <span class="mu">highlights who is most likely to boom or bust</span></div>${outlook}<div class="xg"><div>${pass}${recT}</div><div>${rush}${rusT}</div><div>${fpT}<div style="height:10px"></div>${dvpDetail(g)}</div></div><div class="card"><h3>Availability <span class="mu">(injury report + your overrides; an Out player’s targets and carries are redistributed to teammates)</span></h3><div class="xg">${avl}</div></div>${obscHTML(g,pe)}<div class="mu" style="margin-top:6px">Player lines = team projection (algorithm ${aid}) × each player’s share and efficiency, shrunk toward the league when the sample is small. Click the game again to collapse.</div>${tdResearch(g)}</div>`}

/* ================= Parlay Builder ================= */
const PAR={legs:4,target:2000,obj:'p',src:16,oneGame:true,minP:.3,msg:''};
function sigmas(){ensureVL();let em=[],et=[];Object.keys(VL).forEach(id=>{const g=S.games[id],p=VL[id].p[PAR.src];if(!g||!p||!isFinite(p.a+p.h))return;em.push((g.home_score-g.away_score)-(p.h-p.a));et.push((g.home_score+g.away_score)-(p.h+p.a))});
 const sd=a=>Math.sqrt(avg_(a.map(x=>x*x))),n=em.length,mix=(v,d)=>n?Math.sqrt((n*v*v+20*d*d)/(n+20)):d;return{m:mix(n?sd(em):13.5,13.5),t:mix(n?sd(et):10.5,10.5),n}}
const fmtSp=s=>s===0?'PK':(s>0?'+':'')+f(s,1);
const nvp=(o1,o2)=>{const a=impP(o1),b=impP(o2);return a/(a+b)};
function mkLeg(o){const c=cfg().calib,pm=o.pm,cap=o.kind==='prop'?.10:.05,p=clampF(pm+clampF(c*(o.pRaw-pm),-cap,cap),.01,.99),pr=decOf(o.odds)*100-100;return{...o,p,fair:fairAm(p),imp:impP(o.odds),edge:p-impP(o.odds),ev:p*pr-(1-p)*100,dec:decOf(o.odds)}}
function weekGames(){const w=curWeekKey();return games().filter(g=>g.week===w&&!g.final)}
function gameLegs(){const sg=sigmas(),out=[];weekGames().forEach(g=>{const p=dp(g,PAR.src);if(!isFinite(p.a.pts+p.h.pts))return;const m=p.h.pts-p.a.pts,tt=p.h.pts+p.a.pts,num=v=>typeof v==='number'&&isFinite(v),oddsOf=(v)=>num(v)?v:-110;
  if(num(g.spread)){const ph=Phi((m+g.spread)/sg.m);
   out.push(mkLeg({g:g.id,week:g.week,kind:'game',mk:'Spread',label:`${g.home} ${fmtSp(g.spread)}`,odds:oddsOf(g.home_spread_odds),pRaw:ph,pm:.5,grp:g.id+'|S'}));
   out.push(mkLeg({g:g.id,week:g.week,kind:'game',mk:'Spread',label:`${g.away} ${fmtSp(-g.spread)}`,odds:oddsOf(g.away_spread_odds),pRaw:1-ph,pm:.5,grp:g.id+'|S'}))}
  if(num(g.total)){const po=1-Phi((g.total-tt)/sg.t);
   out.push(mkLeg({g:g.id,week:g.week,kind:'game',mk:'Total',label:`${g.away}@${g.home} Over ${f(g.total,1)}`,odds:oddsOf(g.over_odds),pRaw:po,pm:.5,grp:g.id+'|T'}));
   out.push(mkLeg({g:g.id,week:g.week,kind:'game',mk:'Total',label:`${g.away}@${g.home} Under ${f(g.total,1)}`,odds:oddsOf(g.under_odds),pRaw:1-po,pm:.5,grp:g.id+'|T'}))}
  if(num(g.home_ml)&&num(g.away_ml)){const ph=Phi(m/sg.m),pmH=nvp(g.home_ml,g.away_ml);
   out.push(mkLeg({g:g.id,week:g.week,kind:'game',mk:'Moneyline',label:`${g.home} to win`,odds:g.home_ml,pRaw:ph,pm:pmH,grp:g.id+'|M'}));
   out.push(mkLeg({g:g.id,week:g.week,kind:'game',mk:'Moneyline',label:`${g.away} to win`,odds:g.away_ml,pRaw:1-ph,pm:1-pmH,grp:g.id+'|M'}))}});return out}
const STL={pass_yds:'pass yds',pass_td:'pass TD',pass_att:'pass att',pass_cmp:'completions',int:'INT',rush_yds:'rush yds',rush_att:'carries',rush_td:'rush TD',rec:'receptions',rec_yds:'rec yds',rec_td:'rec TD',tgt:'targets',any_td:'anytime TD',fp:'fantasy pts'};
function propLegs(){const out=[],props=S.props||[];if(!props.length)return out;const idx={};weekGames().forEach(g=>{const pe=pEng(g,PAR.src);[g.home,g.away].forEach(t=>pe[t].players.forEach(p=>{idx[p.name]={p,g}}))});
 props.forEach(r=>{const hit=idx[r.player];if(!hit||hit.p.a<.5||typeof r.line!=='number')return;const po=probOver(hit.p,r.stat,r.line);if(!isFinite(po))return;const anyTD=r.stat==='any_td'||/_td$/.test(r.stat),oo=typeof r.over_odds==='number'?r.over_odds:-110,uo=typeof r.under_odds==='number'?r.under_odds:-110,both=typeof r.over_odds==='number'&&typeof r.under_odds==='number',pmo=both?nvp(oo,uo):.5,lab=`${r.player} ${STL[r.stat]||r.stat}`;
  out.push(mkLeg({g:hit.g.id,week:hit.g.week,kind:'prop',mk:'Prop',label:`${lab} Over ${r.line}`,odds:oo,pRaw:po,pm:pmo,grp:'P|'+r.player+'|'+r.stat,player:r.player,proj:statMu(hit.p,r.stat)}));
  if(!(anyTD&&r.under_odds===undefined)&&(typeof r.under_odds==='number'||!anyTD))out.push(mkLeg({g:hit.g.id,week:hit.g.week,kind:'prop',mk:'Prop',label:`${lab} Under ${r.line}`,odds:uo,pRaw:1-po,pm:1-pmo,grp:'P|'+r.player+'|'+r.stat,player:r.player,proj:statMu(hit.p,r.stat)}))});return out}
/* best combination of N legs whose combined odds reach the target (group knapsack, at most one leg per group) */
function buildParlays(legs,N,targetAm,obj,oneGame,ban){const pool=legs.filter(l=>l.p>=PAR.minP&&!(ban||new Set()).has(l.label)),gk=l=>oneGame?l.g:l.grp,groups=new Map();pool.forEach(l=>{const k=gk(l);(groups.get(k)||groups.set(k,[]).get(k)).push(l)});
 const G=[...groups.values()],step=.02,Tl=Math.log(1+targetAm/100),B=Math.ceil(Tl/step),W=B+1,NEG=-1e18,val=new Float64Array((N+1)*W).fill(NEG);val[0]=0;
 const ch=G.map(()=>({leg:new Int16Array((N+1)*W).fill(-1),pb:new Int16Array((N+1)*W).fill(-1),pj:new Int8Array((N+1)*W).fill(-1)}));
 G.forEach((grp,gi)=>{const nv=Float64Array.from(val),C=ch[gi];for(let j=0;j<N;j++)for(let b=0;b<=B;b++){const v=val[j*W+b];if(v<=NEG/2)continue;grp.forEach((l,li)=>{const q=Math.floor(Math.log(l.dec)/step),nb=Math.min(B,b+q),sc=v+Math.log(l.p)+(obj==='ev'?Math.log(l.dec):0),k=(j+1)*W+nb;if(sc>nv[k]+1e-12){nv[k]=sc;C.leg[k]=li;C.pb[k]=b;C.pj[k]=j}})}val.set(nv)});
 const end=N*W+B;if(val[end]<=NEG/2)return null;const picked=[];let j=N,b=B;for(let gi=G.length-1;gi>=0&&j>0;gi--){const C=ch[gi],k=j*W+b;if(C.leg[k]>=0&&C.pj[k]===j-1&&val[k]>NEG/2&&(C.pb[k]>=0)){/* chosen at this group only if it improved the table there */picked.push(G[gi][C.leg[k]]);b=C.pb[k];j--}}return picked.length===N?picked:null}
function parlayStats(L){const dec=L.reduce((a,l)=>a*l.dec,1),pj=L.reduce((a,l)=>a*l.p,1);return{dec,am:amOfDec(dec),pj,ev:(pj*dec-1)*100,oneIn:1/pj}}
function parlaySearch(legs){const res=[],ban=new Set(),N=PAR.legs;for(let i=0;i<5;i++){const L=buildParlays(legs,N,PAR.target,PAR.obj,PAR.oneGame,ban);if(!L)break;const st=parlayStats(L);if(st.dec<1+PAR.target/100-1e-9)break;res.push({L,...st});ban.add(L.slice().sort((a,b)=>a.p-b.p)[0].label)}return res}
const legRow=l=>`<tr><td>${l.label}</td><td>${l.mk}</td><td>${Math.round(l.p*100)}%</td><td>${fmtAm(l.fair)}</td><td>${fmtAm(l.odds)}</td><td style="color:${l.edge>0?'var(--g)':'var(--r)'}">${l.edge>=0?'+':''}${(l.edge*100).toFixed(1)}%</td><td>${l.ev>=0?'+':''}${f(l.ev,1)}</td></tr>`;
const legTbl=(L,extra)=>`<div class="w"><table class="xt"><tr><th>Bet</th><th>Market</th><th>Model chance</th><th>Fair odds</th><th>Posted odds</th><th>Edge</th><th>EV per $100</th></tr>${L.map(legRow).join('')||'<tr><td colspan=7 class="mu">Nothing qualifies.</td></tr>'}</table></div>`;
function parImport(){const el=document.getElementById('par_props'),t=el&&el.value||'';try{PAR.msg='✔ '+IMP.props(t);save();touch(['props'])}catch(e){PAR.msg='✖ '+e.message}render()}
function vPar(){if(!S.teams||!S.weekly)return '<div class="card">Load the data first (the Games tab shows the loading status).</div>';ensureVL();
 const sg=sigmas(),gl=gameLegs(),pl=propLegs(),all=[...gl,...pl],c=cfg().calib,wkn=curWeekKey();
 const byEdge=[...gl].filter(l=>l.edge>0).sort((a,b)=>b.ev-a.ev).slice(0,10),pByP=[...pl].sort((a,b)=>b.p-a.p).slice(0,12),pByEdge=[...pl].filter(l=>l.edge>0).sort((a,b)=>b.ev-a.ev).slice(0,10);
 const ps=parlaySearch(all),maxDec=[...all].filter(l=>l.p>=PAR.minP).sort((a,b)=>b.dec-a.dec).slice(0,PAR.legs).reduce((a,l)=>a*l.dec,1);
 return `<div class="card"><h3>Parlay Builder <span class="mu">· week ${WL[wkn]||wkn}</span></h3><div class="mu">Best available bets for this week’s unplayed games, using projection <select onchange="PAR.src=+this.value;render()">${ALG.map((n,i)=>`<option value="${i+1}" ${PAR.src===i+1?'selected':''}>${n}</option>`).join('')}</select>.
 Chances come from the model’s projected margin and total with the model’s own historical miss size (margin ±${f(sg.m,1)}, total ±${f(sg.t,1)}; ${sg.n} graded games${sg.n<30?', so mostly typical NFL defaults for now':''}), then pulled <b>${Math.round((1-c)*100)}%</b> of the way back toward the market’s own price, and no leg may claim more than a 5-point edge over the market on game lines (10 on props), because a few weeks of results can’t prove the model beats a betting market:
 <select onchange="cfgSet('calib',this.value)">${[.3,.5,.65,.8,1].map(v=>`<option value="${v}" ${c===v?'selected':''}>${Math.round(v*100)}% trust in the model</option>`).join('')}</select>.
 <b>Fair odds</b> = the American odds that would make that chance break even: ${'p ≥ 50% → −100·p ÷ (1−p), p &lt; 50% → +100·(1−p) ÷ p'}. For example 70% is <b>−233</b> (−142 is the price of a 58.7% chance). <b>Edge</b> = model chance − chance implied by the posted odds. Missing odds are assumed −110. Nothing here is a guarantee or financial advice.</div></div>
 <div class="card"><h3>Best value bets: game lines</h3>${legTbl(byEdge)}<div class="mu">Only bets where the model’s chance beats the posted price. Games without a spread or total in your data can’t be priced.</div></div>
 <div class="card"><h3>Player props</h3>${S.props&&S.props.length?`<div class="mu" style="margin-bottom:4px">Most likely to cover their lines:</div>${legTbl(pByP)}<div class="mu" style="margin:8px 0 4px">Best value (model chance vs posted odds):</div>${legTbl(pByEdge)}`:'<div class="mu">No prop lines loaded. Free feeds of sportsbook player props aren’t available, so paste the lines you see at your book (one per row) and this section ranks them.</div>'}
  <div class="mu" style="margin-top:8px">Paste prop lines (CSV: player,stat,line,over_odds,under_odds). Stats: pass_yds, pass_td, pass_att, pass_cmp, int, rush_yds, rush_att, rush_td, rec, rec_yds, rec_td, tgt, any_td, fp.</div><textarea id="par_props" placeholder="player,stat,line,over_odds,under_odds&#10;Example WR,rec_yds,62.5,-115,-105"></textarea><button class="b" onclick="parImport()">Import prop lines</button> ${PAR.msg?`<span class="mu">${PAR.msg}</span>`:''}</div>
 <div class="card"><h3>Perfect parlay builder</h3><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">Legs <select onchange="PAR.legs=+this.value;render()">${[2,3,4,5,6,7,8].map(n=>`<option ${PAR.legs===n?'selected':''}>${n}</option>`).join('')}</select> Target odds <input type="number" value="${PAR.target}" step="100" min="100" style="width:100px" onchange="PAR.target=Math.max(100,+this.value||100);render()"> (e.g. 5000 = +5000)
 Optimize <select onchange="PAR.obj=this.value;render()"><option value="p" ${PAR.obj==='p'?'selected':''}>highest chance of hitting</option><option value="ev" ${PAR.obj==='ev'?'selected':''}>best expected value</option></select>
 <label><input type="checkbox" ${PAR.oneGame?'checked':''} onchange="PAR.oneGame=this.checked;render()"> one leg per game</label> Min leg chance <select onchange="PAR.minP=+this.value;render()">${[.2,.3,.4,.5].map(v=>`<option value="${v}" ${PAR.minP===v?'selected':''}>${Math.round(v*100)}%</option>`).join('')}</select></div>
 ${ps.length?ps.map((x,i)=>`<div style="margin-top:10px"><b>#${i+1}</b> · ${PAR.legs} legs · odds <b>${fmtAm(x.am)}</b> · chance of hitting <b>${(x.pj*100).toFixed(2)}%</b> (1 in ${f(x.oneIn,0)}) · expected value ${x.ev>=0?'+':''}${f(x.ev,0)}% per $1 staked${legTbl(x.L)}</div>`).join(''):`<div class="msg er" style="margin-top:8px">No ${PAR.legs}-leg combination reaches ${fmtAm(PAR.target)} with the legs available (${all.filter(l=>l.p>=PAR.minP).length} legs at or above ${Math.round(PAR.minP*100)}%). The longest odds possible are about ${fmtAm(amOfDec(maxDec))}. Try more legs, a lower target, a lower minimum chance, or untick one-leg-per-game.</div>`}
 <div class="mu" style="margin-top:8px">Joint chance multiplies each leg’s chance, which assumes the legs are independent. Legs from the same game (or a player and his team) are correlated, so keep “one leg per game” on for honest numbers. Every extra leg also compounds the bookmaker’s margin, so parlays almost always lose money over time even when each leg has an edge.</div></div>`}
const vParSafe=()=>{try{return vPar()}catch(e){return '<div class="card"><b>Parlay Builder error:</b> '+e.message+'<div class="mu">The other tabs are unaffected.</div></div>'}};

 document.addEventListener('mouseover',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tipEl.style.display='none';return}tipEl.innerHTML=t.getAttribute('data-tip');tipEl.style.display='block'});
